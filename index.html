        ].map((d,i,arr)=>(
          <div key={d.device} style={{marginBottom:i<arr.length-1?12:0}}>
            <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:6,display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:18}}>{d.emoji}</span>{d.device}
            </div>
            <div style={{background:t.sur2,borderRadius:12,padding:"10px 14px",fontSize:13,color:t.tx2}}>
              {d.hint}
            </div>
            {i<arr.length-1&&<div style={{height:1,background:t.brd,margin:"12px 0"}}/>}
          </div>
        ))}
      </div>

      {/* ── Appearance + Settings side by side shortcut tiles */}
      <div style={{margin:"0 14px 14px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:18,padding:"16px",cursor:"pointer"}} onClick={()=>setDark(!dark)}>
          <div style={{fontSize:28,marginBottom:6}}>{dark?"☀️":"🌙"}</div>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:2}}>{dark?"Light Mode":"Dark Mode"}</div>
          <div style={{fontSize:11,color:t.tx3}}>Tap to switch</div>
        </div>
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:18,padding:"16px",cursor:"pointer"}} onClick={()=>setSettOpen(!settOpen)}>
          <div style={{fontSize:28,marginBottom:6}}>⚙️</div>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:2}}>Settings</div>
          <div style={{fontSize:11,color:t.tx3}}>Badges, defaults</div>
        </div>
      </div>

      {/* Settings panel */}
      {settOpen&&(
        <div style={{margin:"0 14px 14px",background:t.sur,border:`1px solid ${t.brd}`,borderRadius:18,padding:"18px"}}>
          <div style={{fontSize:14,fontWeight:800,color:t.tx,marginBottom:14}}>⚙️ Settings & Defaults</div>
          {[{key:"showOff",label:"Official badge on cards"},{key:"showHuel",label:"Huel+ badge on cards"},{key:"showAlc",label:"18+ badge on cards"},{key:"autoHuel",label:"Auto-enable Huel when opening a recipe"},{key:"lowGIOnly",label:"🩺 Hide high GI recipes (GI 70+) everywhere"}].map(({key,label})=>(
            <div key={key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${t.brd}`}}>
              <span style={{fontSize:13,color:t.tx,flex:1,paddingRight:12}}>{label}</span>
              <Tog on={defs[key]} set={v=>setDefs(d=>({...d,[key]:v}))}/>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${t.brd}`}}>
            <div>
              <div style={{fontSize:13,color:t.tx}}>🩺 Diabetic Mode</div>
              <div style={{fontSize:10,color:t.tx3}}>Sort all recipes by GI score (lowest first)</div>
            </div>
            <Tog on={diabeticMode} set={setDiabeticMode}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0"}}>
            <span style={{fontSize:13,color:t.tx}}>Default Huel scoops</span>
            <div style={{display:"flex",gap:6}}>
              {[1,2].map(s=><button key={s} onClick={()=>setDefs(d=>({...d,defScoops:s}))} style={{background:defs.defScoops===s?t.hAcc:t.sur2,color:defs.defScoops===s?"#FFF":t.tx2,border:`1px solid ${t.brd}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontWeight:700,fontSize:13}}>{s}</button>)}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderTop:`1px solid ${t.brd}`,marginTop:4}}>
            <div>
              <div style={{fontSize:13,color:"#D32F2F",fontWeight:600}}>⚠️ Reset App Data</div>
              <div style={{fontSize:10,color:t.tx3}}>Clears favourites, ratings, notes, tracker & saved blends</div>
            </div>
            <button onClick={()=>{
              if(window.confirm("Reset ALL app data? This cannot be undone.")) {
                ["bb_favs","bb_ratings","bb_notes","bb_made","bb_blends","bb_tracker","bb_recent","bb_searches","bb_diabetic"].forEach(k=>localStorage.removeItem(k));
                setFavs([]); setRatings({}); setNotes({}); setMadeCount({}); setSavedBlends([]); setTrackerLog([]); setRecent([]); setRecentSearches([]); setDiabeticMode(false);
                alert("App data reset.");
              }
            }} style={{background:"rgba(211,47,47,0.1)",color:"#D32F2F",border:"1px solid rgba(211,47,47,0.3)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600,flexShrink:0}}>Reset</button>
          </div>
        </div>
      )}

      {/* ── About (Duffers card) */}
      <div style={{margin:"0 14px 14px",background:t.sur,border:`1px solid ${t.brd}`,borderRadius:18,padding:"18px"}}>
        <div style={{fontSize:15,fontWeight:800,color:t.tx,marginBottom:10}}>🧑‍🍳 About</div>
        <p style={{fontSize:13,color:t.tx2,lineHeight:1.7,marginBottom:8}}>
          Created by <strong style={{color:t.tx}}>Duffers</strong> — a free, ad-free smoothie companion for Ninja blender owners. Built to make healthy blending easier and more informative for everyone.
        </p>
        <div style={{fontSize:12,color:t.tx3,lineHeight:1.8}}>
          dirtyduffers.github.io/ninja-woodfire-app · dirtyduffers.github.io/ninja-airfry-app
        </div>
      </div>

      {/* ── Stats footer */}
      <div style={{margin:"0 14px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        {[{emoji:"📋",val:RECIPES.length,label:"Recipes"},{emoji:"⭐",val:RECIPES.filter(r=>r.official).length,label:"Official"},{emoji:"🌿",val:RECIPES.filter(r=>r.huel).length,label:"Huel+"}].map(({emoji,val,label})=>(
          <div key={label} style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:14,padding:"14px 10px",textAlign:"center"}}>
            <div style={{fontSize:22,marginBottom:4}}>{emoji}</div>
            <div style={{fontSize:20,fontWeight:800,color:t.acc}}>{val}</div>
            <div style={{fontSize:10,color:t.tx3}}>{label}</div>
          </div>
        ))}
      </div>

    </div>
  );

  // ── RENDER ────────────────────────────────────────────────────────────────
  const showDetail = !!selR;
  return (
    <div style={{fontFamily:"'Inter',-apple-system,sans-serif",minHeight:"100vh",background:t.bg,color:t.tx,paddingBottom:80,transition:"background 0.25s,color 0.25s"}}>
      <style>{`* { box-sizing:border-box; margin:0; padding:0; } ::-webkit-scrollbar { width:3px; height:3px; } ::-webkit-scrollbar-thumb { background:#888; border-radius:2px; } input::placeholder { color:#888; } select option { background:${dark?"#1A1A1A":"#FFFFFF"}; color:${t.tx}; }`}</style>

      {/* ── HEADER ─────────────────────────────────────────────────────────── */}
      <div style={{background:t.nav,borderBottom:`1px solid ${t.navBrd}`,padding:"10px 14px",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:900,margin:"0 auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,background:"linear-gradient(135deg,#FF6B00,#FF3D00)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🌀</div>
          <div><div style={{fontSize:16,fontWeight:800,color:t.tx,letterSpacing:"-0.4px"}}>BlendBoss</div><div style={{fontSize:9,color:t.tx3,letterSpacing:"0.5px",textTransform:"uppercase"}}>Recipe Hub</div></div>
          {/* Search toggle */}
          <button onClick={()=>setHeaderSearch(!headerSearch)} style={{marginLeft:"auto",background:headerSearch?t.acc:t.sur2,color:headerSearch?"#FFF":t.tx2,border:`1px solid ${headerSearch?t.acc:t.brd}`,borderRadius:9,padding:"5px 10px",cursor:"pointer",fontSize:14}}>🔍</button>
          {/* Unit toggle */}
          <button onClick={()=>setImperial(!imperial)}
            style={{background:imperial?t.acc:t.sur2,color:imperial?"#FFF":t.tx2,border:`1px solid ${imperial?t.acc:t.brd}`,borderRadius:9,padding:"5px 10px",cursor:"pointer",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:4}}>
            {imperial?"🇺🇸":"⚖️"}
          </button>
          {/* Dark toggle */}
          <button onClick={()=>setDark(!dark)} style={{background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:9,padding:"5px 9px",cursor:"pointer",fontSize:14,color:t.tx}}>
            {dark?"☀️":"🌙"}
          </button>
        </div>
        {headerSearch && (
          <div style={{paddingTop:8,display:"flex",gap:8,alignItems:"center"}}>
            <div style={{flex:1,position:"relative"}}>
              <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:t.tx3,fontSize:13}}>🔍</span>
              <input autoFocus value={q}
                onChange={e=>{setQ(e.target.value);setSelCat(e.target.value?"all":null);setTab("recipes");}}
                onKeyDown={e=>{if(e.key==="Enter"&&q.trim()){setRecentSearches(prev=>[q.trim(),...prev.filter(s=>s!==q.trim())].slice(0,5));}}}
                placeholder={`Search all ${RECIPES.length} recipes...`}
                style={{width:"100%",background:t.sur2,border:`1px solid ${t.acc}`,borderRadius:10,padding:"8px 10px 8px 30px",color:t.tx,fontSize:13,outline:"none"}}/>
            </div>
            {q&&<button onClick={()=>{setQ("");setSelCat(null);}} style={{background:"none",border:"none",cursor:"pointer",color:t.acc,fontSize:13,fontWeight:700}}>Clear</button>}
            {!q && recentSearches.length > 0 && (
              <div style={{position:"absolute",top:"100%",left:0,right:0,background:t.sur,border:`1px solid ${t.brd}`,borderRadius:12,padding:"8px",zIndex:300,marginTop:4}}>
                <div style={{fontSize:10,color:t.tx3,fontWeight:600,marginBottom:6,paddingLeft:4}}>Recent searches</div>
                {recentSearches.map(s=>(
                  <button key={s} onClick={()=>{setQ(s);setSelCat("all");setTab("recipes");}}
                    style={{display:"block",width:"100%",textAlign:"left",background:"none",border:"none",padding:"6px 8px",cursor:"pointer",fontSize:12,color:t.tx2,borderRadius:8}}>
                    🕐 {s}
                  </button>
                ))}
                <button onClick={()=>setRecentSearches([])} style={{display:"block",width:"100%",textAlign:"left",background:"none",border:"none",padding:"4px 8px",cursor:"pointer",fontSize:11,color:t.tx3}}>Clear history</button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── CONTENT ────────────────────────────────────────────────────────── */}
      {showShopping && <ShoppingListView/>}
      {shareText && <ShareModal/>}
      <div style={{maxWidth:900,margin:"0 auto"}}>
        {showDetail ? (
          <div style={{paddingTop:12}}><DetailView/></div>
        ) : (
          <div style={{paddingTop:12}}>
            {tab==="recipes" && (selCat ? <CatView/> : <HomeView/>)}
            {tab==="filter"  && <FilterView/>}
            {tab==="builder" && <BuilderView/>}
            {tab==="compare" && <CompareView/>}
            {tab==="tracker" && <TrackerView/>}
            {tab==="about"   && <AboutView/>}
          </div>
        )}
      </div>

      {/* ── BOTTOM NAV ─────────────────────────────────────────────────────── */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:t.nav,borderTop:`1px solid ${t.navBrd}`,display:"flex",zIndex:200,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {[
          { id:"recipes", emoji:"🌀", label:"Recipes" },
          { id:"filter",  emoji:"🔎", label:"Find", badge: activeFilterCount > 0 ? activeFilterCount : null },
          { id:"builder", emoji:"🧪", label:"Build",   badge: totalBuilderItems > 0 ? totalBuilderItems : null },
          { id:"compare", emoji:"⚖️", label:"Compare", badge: compareIds.length > 0 ? compareIds.length : null },
          { id:"tracker", emoji:"📅", label:"Tracker", badge: todayLog.length > 0 ? todayLog.length : null },
          { id:"about",   emoji:"ℹ️", label:"About"   },
        ].map(nt=>(
          <button key={nt.id} onClick={()=>{setTab(nt.id);if(nt.id!=="recipes"){setSelR(null);}if(nt.id!=="recipes"&&nt.id!=="compare"){setCompareMode(false);}}}
            style={{flex:1,background:"none",border:"none",cursor:"pointer",padding:"7px 0 9px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}}>
            <span style={{fontSize:18}}>{nt.emoji}</span>
            {nt.badge&&<span style={{position:"absolute",top:3,right:"15%",background:t.acc,color:"#FFF",fontSize:7,fontWeight:800,minWidth:13,height:13,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 3px"}}>{nt.badge}</span>}
            <span style={{fontSize:9,fontWeight:600,color:tab===nt.id&&!showDetail?t.acc:t.tx3}}>{nt.label}</span>
            {tab===nt.id&&!showDetail&&<div style={{width:16,height:2,background:t.acc,borderRadius:2}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
