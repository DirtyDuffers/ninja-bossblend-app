// ─── UTILS ────────────────────────────────────────────────────────────────────
const toOz  = g   => +(g  * 0.035274).toFixed(1);
const toFloz = ml => +(ml * 0.033814).toFixed(1);
const toCups = ml => +(ml * 0.00422675).toFixed(2);
const toTbsp = ml => +(ml * 0.067628).toFixed(1);

function fmtWeight(g, imperial) {
  if (!g && g !== 0) return "—";
  return imperial ? `${toOz(g)} oz` : `${Math.round(g)} g`;
}
function fmtVol(ml, imperial) {
  if (!ml && ml !== 0) return "—";
  if (imperial) {
    const fl = toFloz(ml);
    const c  = toCups(ml);
    return `${fl} fl oz (${c} cup${c !== 1 ? "s" : ""})`;
  }
  return `${Math.round(ml)} ml`;
}

// Scale an ingredient string by a multiplier, handling leading numbers/fractions
function scaleIngredient(str, mult) {
  if (mult === 1) return str;
  // Match leading number/fraction like "225g", "1½", "¾", "1 cup", "2 tbsp" etc.
  const fracMap = { "¼":0.25,"½":0.5,"¾":0.75,"⅓":0.333,"⅔":0.667,"⅛":0.125,"⅜":0.375,"⅝":0.625,"⅞":0.875 };
  // Replace unicode fractions to decimal first
  let s = str.replace(/[¼½¾⅓⅔⅛⅜⅝⅞]/g, m => fracMap[m] || m);
  // Match a leading number (int or decimal) possibly followed by a second number
  const m = s.match(/^([\d.]+)\s*([\d.]*)/);
  if (!m) return str; // no leading number, can't scale
  const base = parseFloat(m[1]) + (m[2] ? parseFloat(m[2]) : 0);
  const scaled = base * mult;
  // Format nicely
  const fmt = scaled % 1 === 0 ? scaled.toString() : +(scaled.toFixed(1)).toString();
  return s.replace(/^[\d.\s¼½¾⅓⅔⅛⅜⅝⅞]+/, fmt + " ").trimEnd().replace(/\s+/g, " ");
}

function getDifficulty(recipe) {
  const ingCount = recipe.ing.length;
  const hasSpecialist = ["Max Blend","Crush","Ice Crush"].includes(recipe.prog);
  if (ingCount <= 3 && !hasSpecialist) return { label:"Easy",   color:"#2E7D32", emoji:"🟢" };
  if (ingCount <= 6)                   return { label:"Medium", color:"#E65100", emoji:"🟡" };
  return                                       { label:"Detailed",color:"#1565C0",emoji:"🔵" };
}

function getSwaps(recipe) {
  return recipe.keyIng
    .map(k => {
      const key = Object.keys(SWAPS).find(s => k.toLowerCase().includes(s));
      return key ? { ingredient: k, ...SWAPS[key] } : null;
    })
    .filter(Boolean)
    .slice(0, 3); // max 3 swaps per recipe
}

// ─── MINI BAR CHART COMPONENT ─────────────────────────────────────────────────
function MiniBar({ label, value, max, color, unit, t }) {
  const pct = Math.min(100, max > 0 ? (value / max) * 100 : 0);
  return (
    <div style={{ marginBottom:8 }}>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
        <span style={{ fontSize:11, color:t.tx2, fontWeight:600 }}>{label}</span>
        <span style={{ fontSize:11, color, fontWeight:700 }}>{value}{unit}</span>
      </div>
      <div style={{ height:8, background:t.sur2, borderRadius:4, overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${pct}%`, background:color, borderRadius:4, transition:"width 0.5s ease" }}/>
      </div>
    </div>
  );
}

// ─── MACRO DONUT (SVG) ────────────────────────────────────────────────────────
function MacroDonut({ pro, carb, fat, fib, t }) {
  const total = pro + carb + fat + fib || 1;
  const segments = [
    { label:"Protein", value:pro,  color:"#4CAF50" },
    { label:"Carbs",   value:carb, color:"#FF9800" },
    { label:"Fat",     value:fat,  color:"#9C27B0" },
    { label:"Fibre",   value:fib,  color:"#00BCD4" },
  ];
  const r = 40, cx = 50, cy = 50, stroke = 14;
  let cumPct = 0;
  const arcs = segments.map(s => {
    const pct = s.value / total;
    const startAngle = cumPct * 2 * Math.PI - Math.PI / 2;
    const endAngle   = (cumPct + pct) * 2 * Math.PI - Math.PI / 2;
    cumPct += pct;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const large = pct > 0.5 ? 1 : 0;
    return { ...s, d: pct > 0.005 ? `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z` : null };
  });
  return (
    <div style={{ display:"flex", alignItems:"center", gap:16 }}>
      <svg width={100} height={100} viewBox="0 0 100 100">
        {arcs.map(a => a.d && <path key={a.label} d={a.d} fill={a.color} opacity={0.85}/>)}
        <circle cx={cx} cy={cy} r={r - stroke} fill={t.sur}/>
        <text x={cx} y={cy - 4} textAnchor="middle" fontSize={10} fill={t.tx3}>macros</text>
        <text x={cx} y={cy + 9} textAnchor="middle" fontSize={9} fill={t.tx3}>per serving</text>
      </svg>
      <div style={{ flex:1 }}>
        {segments.map(s => (
          <div key={s.label} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
            <div style={{ width:10, height:10, borderRadius:2, background:s.color, flexShrink:0 }}/>
            <span style={{ fontSize:11, color:t.tx2 }}>{s.label}</span>
            <span style={{ fontSize:11, color:s.color, fontWeight:700, marginLeft:"auto" }}>{+(s.value.toFixed(1))}g</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── GI GAUGE ─────────────────────────────────────────────────────────────────
function GIGauge({ gi, catRecipes, t }) {
  const pct = Math.min(100, (gi / 100) * 100);
  const color = gi < 55 ? "#2E7D32" : gi < 70 ? "#E65100" : "#C62828";
  const avg = catRecipes.length > 0 ? Math.round(catRecipes.reduce((s,r) => s + r.gi, 0) / catRecipes.length) : 0;
  const avgPct = Math.min(100, (avg / 100) * 100);
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
        <span style={{ fontSize:12, fontWeight:700, color }}>GI {gi}</span>
        <span style={{ fontSize:11, color:t.tx3 }}>Category avg: {avg}</span>
      </div>
      <div style={{ height:14, background:t.sur2, borderRadius:7, overflow:"hidden", position:"relative", marginBottom:6 }}>
        {/* gradient background */}
        <div style={{ position:"absolute", inset:0, background:"linear-gradient(to right, #2E7D32 0%, #2E7D32 54%, #E65100 54%, #E65100 69%, #C62828 69%, #C62828 100%)", opacity:0.18 }}/>
        {/* avg marker */}
        <div style={{ position:"absolute", top:0, bottom:0, left:`${avgPct}%`, width:2, background:t.tx3, opacity:0.5 }}/>
        {/* current value */}
        <div style={{ height:"100%", width:`${pct}%`, background:color, borderRadius:7, transition:"width 0.6s ease", position:"relative", zIndex:1 }}/>
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:t.tx3 }}>
        <span>0 Low</span><span>55</span><span>70</span><span>100 High</span>
      </div>
    </div>
  );
}

// ─── SUGAR VS FIBRE BARS ──────────────────────────────────────────────────────
function SugarFibreChart({ sug, fib, t }) {
  const max = Math.max(sug, fib, 20);
  return (
    <div>
      <div style={{ display:"flex", gap:12, alignItems:"flex-end", height:70, marginBottom:6 }}>
        {[{ label:"Sugar", val:sug, color:"#E91E63" }, { label:"Fibre", val:fib, color:"#00BCD4" }].map(({ label, val, color }) => (
          <div key={label} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
            <span style={{ fontSize:11, fontWeight:700, color }}>{+(val.toFixed(1))}g</span>
            <div style={{ width:"100%", height:Math.max(4, (val / max) * 52), background:color, borderRadius:"4px 4px 0 0", transition:"height 0.5s ease" }}/>
          </div>
        ))}
      </div>
      <div style={{ display:"flex", gap:12 }}>
        {[{ label:"Sugar", color:"#E91E63" }, { label:"Fibre", color:"#00BCD4" }].map(({ label, color }) => (
          <div key={label} style={{ flex:1, textAlign:"center", fontSize:11, color:t.tx3, fontWeight:600 }}>{label}</div>
        ))}
      </div>
      {fib > sug && <div style={{ marginTop:8, fontSize:11, color:"#00BCD4", textAlign:"center" }}>✓ More fibre than sugar — excellent blood sugar impact</div>}
    </div>
  );
}

// ─── CALORIE BREAKDOWN ────────────────────────────────────────────────────────
function CalBreakdown({ pro, carb, fat, cal, t }) {
  const fromPro  = Math.round(pro  * 4);
  const fromCarb = Math.round(carb * 4);
  const fromFat  = Math.round(fat  * 9);
  const total = fromPro + fromCarb + fromFat || 1;
  return (
    <div>
      <div style={{ fontSize:11, color:t.tx3, marginBottom:6 }}>Calorie sources (kcal)</div>
      <div style={{ height:16, display:"flex", borderRadius:8, overflow:"hidden", gap:1 }}>
        {[{ val:fromPro, color:"#4CAF50", label:"Protein" }, { val:fromCarb, color:"#FF9800", label:"Carbs" }, { val:fromFat, color:"#9C27B0", label:"Fat" }].map(({ val, color, label }) => (
          val > 0 && <div key={label} title={`${label}: ${val} kcal`} style={{ width:`${(val/total)*100}%`, background:color, transition:"width 0.5s" }}/>
        ))}
      </div>
      <div style={{ display:"flex", gap:8, marginTop:6, flexWrap:"wrap" }}>
        {[{ val:fromPro, color:"#4CAF50", label:"Protein" }, { val:fromCarb, color:"#FF9800", label:"Carbs" }, { val:fromFat, color:"#9C27B0", label:"Fat" }].map(({ val, color, label }) => (
          <span key={label} style={{ fontSize:10, color, fontWeight:600 }}>{label} {val}kcal ({Math.round(val/total*100)}%)</span>
        ))}
      </div>
    </div>
  );
}

function App() {

  const [favs, setFavs]             = useState(storage.get("bb_favs", []));
  const [recent, setRecent]         = useState(storage.get("bb_recent", []));
  const [compareIds, setCompareIds] = useState([]);
  const [compareMode, setCompareMode] = useState(false);

  const [savedBlends, setSavedBlends] = useState(storage.get("bb_blends", []));

  // New feature state

  const [notes, setNotes]           = useState(storage.get("bb_notes", {}));    // {id: "text"}
  const [madeCount, setMadeCount]   = useState(storage.get("bb_made", {}));     // {id: count}
  const [noteEdit, setNoteEdit]     = useState(null);   // recipe id being edited
  const [noteDraft, setNoteDraft]   = useState("");
  const [diabeticMode, setDiabeticMode] = useState(storage.get("bb_diabetic", false));
  const [trackerLog, setTrackerLog] = useState(storage.get("bb_tracker", [])); // [{id, date, servings}]
  const [trackerTargets, setTrackerTargets] = useState(storage.get("bb_targets", {cal:2000,pro:50,carb:250,fat:70,fib:30}));
  const [showTracker, setShowTracker] = useState(false);
  // Find page extra filters

  const [prepMax, setPrepMax]       = useState(99);
  const [seasonFilter, setSeasonFilter] = useState([]);
  const [allergenExclude, setAllergenExclude] = useState([]);
  // UX state
  const [headerSearch, setHeaderSearch] = useState(false); // persistent search in header
  const [onboarded, setOnboarded]   = useState(storage.get("bb_onboarded", false));
  const [showPrint, setShowPrint]   = useState(false);  // print/share modal
  const [filterBadge, setFilterBadge] = useState(0);   // count of active find filters
  const [shoppingList, setShoppingList] = useState([]);  // selected recipe ids for shopping list
  const [showShopping, setShowShopping] = useState(false);
  const [shareText, setShareText]   = useState(null); // fallback share modal text

  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const h = e => setDark(e.matches);
    mq.addEventListener("change", h);
    return () => mq.removeEventListener("change", h);
  }, []);

  useEffect(() => { storage.set("bb_defs", defs); }, [defs]);
  useEffect(() => { storage.set("bb_favs", favs); }, [favs]);
  useEffect(() => { storage.set("bb_recent", recent); }, [recent]);
  useEffect(() => { storage.set("bb_ratings", ratings); }, [ratings]);
  useEffect(() => { storage.set("bb_notes", notes); }, [notes]);
  useEffect(() => { storage.set("bb_made", madeCount); }, [madeCount]);
  useEffect(() => { storage.set("bb_blends", savedBlends); }, [savedBlends]);
  useEffect(() => { storage.set("bb_diabetic", diabeticMode); }, [diabeticMode]);
  useEffect(() => { storage.set("bb_tracker", trackerLog); }, [trackerLog]);
  useEffect(() => { storage.set("bb_targets", trackerTargets); }, [trackerTargets]);
  useEffect(() => { storage.set("bb_searches", recentSearches); }, [recentSearches]);

  const t = dark ? DARK_T : LIGHT_T;

  const openR = (r, from=null) => {
    // Push current location onto nav stack so Back works correctly
    setNavStack(prev => [...prev.slice(-4), { cat: selCat, tab, from }]);
    setSelR(r);
    setHOn(defs.autoHuel && !!r.huel);
    setSc(defs.defScoops);
    setNyuOn(false);
    setNyuFrac(0.5);
    setServMult(1);
    setRecent(prev => {
      const next = [r.id, ...prev.filter(id => id !== r.id)].slice(0, 5);
      return next;
    });
  };

  const goBack = () => {
    const prev = navStack[navStack.length - 1];
    setNavStack(s => s.slice(0, -1));
    setSelR(null);
    if (prev) {
      setTab(prev.tab || "recipes");
      setSelCat(prev.cat || null);
    } else {
      setSelCat(null);
    }
  };

  const toggleFav = id => setFavs(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
  const toggleCompare = id => setCompareIds(c => c.includes(id) ? c.filter(x => x !== id) : c.length < 3 ? [...c, id] : c);

  const randomRecipe = () => {
    const pool = selCat && selCat !== "all" ? RECIPES.filter(r => r.cat === selCat) : RECIPES;
    openR(pool[Math.floor(Math.random() * pool.length)]);
  };

  const allKeyIngs = useMemo(() => {
    const set = new Set();
    RECIPES.forEach(r => r.keyIng.forEach(k => set.add(k)));
    return Array.from(set).sort();
  }, []);

  const filtered = useMemo(() => {
    let list = RECIPES.filter(r => {
      if (selCat && selCat !== "all" && r.cat !== selCat) return false;
      if (offOnly && !r.official) return false;
      if (q && !r.name.toLowerCase().includes(q.toLowerCase()) && !r.desc.toLowerCase().includes(q.toLowerCase())) return false;
      if (dietFilter.length > 0 && !dietFilter.every(d => r.diet?.includes(d))) return false;
      if (ingInclude.length > 0 && !ingInclude.every(i => r.keyIng.some(k => k.toLowerCase().includes(i.toLowerCase())))) return false;
      if (calMax < 999 && r.nut.cal > calMax) return false;
      if (prepMax < 99 && r.time > prepMax) return false;
      if (seasonFilter.length > 0 && !seasonFilter.some(s => getSeasons(r.id).includes(s))) return false;
      if (allergenExclude.length > 0 && allergenExclude.some(a => getAllergens(r.id).includes(a))) return false;
      if (defs.lowGIOnly && r.gi_label === "high") return false;
      return true;
    });
    if (diabeticMode) list = [...list].sort((a,b) => a.gi - b.gi);
    return list;
  }, [selCat, offOnly, q, dietFilter, ingInclude, calMax, prepMax, seasonFilter, allergenExclude, diabeticMode]);

  // Count active filters for badge on Find tab
  const activeFilterCount = useMemo(() =>
    dietFilter.length + ingInclude.length + allergenExclude.length + seasonFilter.length +
    (calMax < 999 ? 1 : 0) + (prepMax < 99 ? 1 : 0) + (q ? 1 : 0),
    [dietFilter, ingInclude, allergenExclude, seasonFilter, calMax, prepMax, q]
  );

  const calcNut = (r, mult = servMult) => {
    let base = hOn && r.huel
      ? { cal:r.nut.cal+HUEL_SCOOP.cal*sc, pro:r.nut.pro+HUEL_SCOOP.pro*sc, fib:r.nut.fib+HUEL_SCOOP.fib*sc, sug:r.nut.sug, carb:r.nut.carb+HUEL_SCOOP.carb*sc, fat:r.nut.fat+HUEL_SCOOP.fat*sc }
      : {...r.nut};
    if (nyuOn) {
      base = {
        cal:  base.cal  + NYU_SACHET.cal  * nyuFrac,
        pro:  base.pro  + NYU_SACHET.pro  * nyuFrac,
        fib:  base.fib  + NYU_SACHET.fib  * nyuFrac,
        sug:  base.sug  + NYU_SACHET.sug  * nyuFrac,
        carb: base.carb + NYU_SACHET.carb * nyuFrac,
        fat:  base.fat  + NYU_SACHET.fat  * nyuFrac,
      };
    }
    return { cal:Math.round(base.cal*mult), pro:+(base.pro*mult).toFixed(1), fib:+(base.fib*mult).toFixed(1), sug:+(base.sug*mult).toFixed(1), carb:+(base.carb*mult).toFixed(1), fat:+(base.fat*mult).toFixed(1) };
  };

  const builderNut = useMemo(() => {
    let cal=0,pro=0,carb=0,fat=0,fib=0,sug=0;
    Object.values(builder).flat().forEach(id => {
      const ing = ING_MAP[id]; const amt = builderAmounts[id]||0;
      if (!ing||!amt) return;
      cal+=ing.perUnit.cal*amt; pro+=ing.perUnit.pro*amt; carb+=ing.perUnit.carb*amt;
      fat+=ing.perUnit.fat*amt; fib+=ing.perUnit.fib*amt; sug+=ing.perUnit.sug*amt;
    });
    return { cal:Math.round(cal), pro:+(pro.toFixed(1)), carb:+(carb.toFixed(1)), fat:+(fat.toFixed(1)), fib:+(fib.toFixed(1)), sug:+(sug.toFixed(1)) };
  }, [builder, builderAmounts]);

  // Estimated GI for builder blend (weighted average by calorie contribution)
  const builderGI = useMemo(() => {
    const ids = Object.values(builder).flat();
    if (ids.length === 0) return null;
    let weightedSum = 0, totalCal = 0;
    ids.forEach(id => {
      const ing = ING_MAP[id]; const amt = builderAmounts[id]||0;
      if (!ing||!amt) return;
      const cal = ing.perUnit.cal * amt;
      weightedSum += (ing.gi||0) * cal;
      totalCal += cal;
    });
    return totalCal > 0 ? Math.round(weightedSum / totalCal) : null;
  }, [builder, builderAmounts]);

  const totalBuilderItems = Object.values(builder).flat().length;

  const toggleBuilderIng = id => {
    const layer = ING_MAP[id].layer;
    setBuilder(b => { const cur=b[layer]||[]; return { ...b,[layer]:cur.includes(id)?cur.filter(x=>x!==id):[...cur,id] }; });
    if (!builderAmounts[id]) {
      const ing = ING_MAP[id];
      const def = ing.unit==="each"?1:ing.unit==="leaves"?5:ing.unit==="sachet"?0.5:ing.unit==="scoop"?1:ing.unit==="tsp"?1:ing.unit==="tbsp"?1:100;
      setBuilderAmounts(a => ({...a,[id]:def}));
    }
  };

  // Ratings
  const setRating = (id, val) => setRatings(r => ({...r, [id]: r[id]===val ? 0 : val}));
  const getRating = id => ratings[id] || 0;

  // Made counter
  const incrementMade = (id) => {
    setMadeCount(m => ({...m, [id]: (m[id]||0)+1}));
    const recipe = RECIPES.find(r => r.id === id);
    if (recipe) logToday(recipe, 1);
  };
  const getMade = id => madeCount[id] || 0;

  // Tracker
  const todayStr = () => new Date().toISOString().slice(0,10);
  const logToday = (recipe, servings=1) => {
    setTrackerLog(log => [...log, { id:recipe.id, name:recipe.name, emoji:recipe.emoji, date:todayStr(), servings, nut:recipe.nut }]);
  };
  const todayLog = trackerLog.filter(e => e.date === todayStr());
  const todayTotals = todayLog.reduce((acc, e) => ({
    cal:  acc.cal  + (e.nut.cal  * e.servings),
    pro:  acc.pro  + (e.nut.pro  * e.servings),
    carb: acc.carb + ((e.nut.carb||0) * e.servings),
    fat:  acc.fat  + ((e.nut.fat||0)  * e.servings),
    fib:  acc.fib  + (e.nut.fib  * e.servings),
  }), {cal:0,pro:0,carb:0,fat:0,fib:0});

  // Saved blends
  const saveBlend = () => {
    if (!blendName.trim()) return;
    const nm = blendName.trim();
    if (savedBlends.some(b => b.name.toLowerCase() === nm.toLowerCase())) {
      if (!window.confirm(`A blend called "${nm}" already exists. Save anyway?`)) return;
    }
    const newBlend = { id: Date.now(), name:nm, builder:{...builder}, amounts:{...builderAmounts}, nut:{...builderNut} };
    setSavedBlends(b => [newBlend, ...b]);
    setBlendName("");
  };
  const loadBlend = blend => { setBuilder(blend.builder); setBuilderAmounts(blend.amounts); };
  const deleteBlend = id => setSavedBlends(b => b.filter(x => x.id !== id));

  // Share recipe text
  // Share — always shows the modal so user can copy/share however they like.
  // Also attempts Web Share API (native sheet on iOS/Android when on HTTPS).
  const doShare = (title, text) => {
    // Always show the modal for reliable cross-platform behaviour
    setShareText({ title, text });
    // Also fire native share if available (won't interfere with modal)
    if (navigator.share) {
      navigator.share({ title, text }).catch(() => {});
    }
  };

  const shareRecipe = r => {
    const n = calcNut(r);
    const boosts = [hOn && r.huel ? `+ Huel (${sc} scoop${sc>1?"s":""})` : null, nyuOn ? `+ New You ${NYU_FLAVOURS[nyuFlavour]?.name} (${nyuFrac===0.25?"¼":nyuFrac===0.5?"½":nyuFrac===0.75?"¾":"1"} sachet)` : null].filter(Boolean);
    const text = [
      `🌀 ${r.name}`,
      ``,
      r.desc,
      ``,
      `📋 Ingredients:`,
      ...r.ing.map(i => `  • ${i}`),
      ...(boosts.length ? [``, `✨ Boosts: ${boosts.join(", ")}`] : []),
      ``,
      `📊 Nutrition per serving:`,
      `  Calories: ${n.cal} kcal  |  Protein: ${n.pro}g  |  Carbs: ${n.carb||"—"}g`,
      `  Fat: ${n.fat||"—"}g  |  Fibre: ${n.fib}g  |  Sugar: ${n.sug}g`,
      `  GI: ${r.gi} (${r.gi_label})`,
      ``,
      `via BlendBoss Recipe Hub 🌀`,
    ].join("\n");
    doShare(r.name, text);
  };

  const shareBlend = () => {
    const ids = Object.values(builder).flat();
    if (!ids.length) return;
    const lines = [];
    ["liquid","sticky","fruit","yoghurt","frozen","greens"].forEach(layer => {
      if (!builder[layer]?.length) return;
      lines.push(`${LAYER_INFO[layer].emoji} ${LAYER_INFO[layer].label}:`);
      builder[layer].forEach(id => {
        const ing = ING_MAP[id]; const amt = builderAmounts[id]||0;
        if (!ing) return;
        lines.push(`  • ${amt} ${ing.unit==="each"?"":ing.unit} ${ing.name}`.replace(/\s+/g," ").trim());
      });
    });
    const n = builderNut;
    const giLabel = builderGI !== null && n.cal > 0
      ? (builderGI < 55 ? "Low GI" : builderGI < 70 ? "Medium GI" : "High GI")
      : null;
    const text = [
      `🧪 My BlendBoss Custom Blend`,
      ``,
      ...lines,
      ``,
      `📊 Estimated Nutrition:`,
      `  Calories: ${n.cal} kcal  |  Protein: ${n.pro}g  |  Carbs: ${n.carb}g`,
      `  Fat: ${n.fat}g  |  Fibre: ${n.fib}g  |  Sugar: ${n.sug}g`,
      ...(giLabel ? [`  ${giLabel} (Est. GI ${builderGI})`] : []),
      ``,
      `via BlendBoss Recipe Hub 🌀`,
    ].join("\n");
    doShare("My BlendBoss Blend", text);
  };

  // Shopping list
  const generateShoppingList = () => {
    const recipes = shoppingList.map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
    if (!recipes.length) return;
    const text = "🛒 BlendBoss Shopping List\n" + "=".repeat(30) + "\n\n" +
      recipes.map(r =>
        `🌀 ${r.name}\n${r.ing.map(i => "  • " + i).join("\n")}`
      ).join("\n\n") +
      "\n\n" + "=".repeat(30) + "\nvia BlendBoss Recipe Hub";
    doShare("BlendBoss Shopping List", text);
  };

  const ShoppingListView = () => (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:500,display:"flex",alignItems:"flex-end"}}>
      <div style={{background:t.sur,borderRadius:"20px 20px 0 0",padding:"20px 16px",width:"100%",maxHeight:"80vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:17,fontWeight:800,color:t.tx}}>🛒 Shopping List</div>
          <button onClick={()=>setShowShopping(false)} style={{background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:8,padding:"4px 10px",cursor:"pointer",color:t.tx2,fontSize:13,fontWeight:600}}>Done</button>
        </div>
        <p style={{fontSize:12,color:t.tx2,lineHeight:1.5,marginBottom:12}}>Tap recipes below to add them. Then share or copy the combined ingredient list.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
          {RECIPES.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(r=>{
            const sel = shoppingList.includes(r.id);
            return (
              <button key={r.id} onClick={()=>setShoppingList(s=>sel?s.filter(x=>x!==r.id):[...s,r.id])}
                style={{background:sel?`${t.acc}18`:t.sur2,border:`1px solid ${sel?t.acc:t.brd}`,borderRadius:12,padding:"10px 8px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:20,flexShrink:0}}>{r.emoji}</span>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:sel?700:600,color:sel?t.acc:t.tx,lineHeight:1.3}}>{r.name}</div>
                  <div style={{fontSize:9,color:t.tx3}}>{r.ing.length} ingredients</div>
                </div>
              </button>
            );
          })}
        </div>
        {shoppingList.length > 0 && (
          <div style={{marginBottom:14,background:t.sur2,borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:12,fontWeight:700,color:t.tx,marginBottom:8}}>{shoppingList.length} recipe{shoppingList.length!==1?"s":""} selected</div>
            {(() => {
              // Combine and deduplicate by first word
              const allIng = RECIPES.filter(r=>shoppingList.includes(r.id)).flatMap(r=>r.ing.map(i=>({recipe:r.name,ing:i})));
              return (
                <div style={{maxHeight:200,overflowY:"auto"}}>
                  {allIng.map((item,i)=>(
                    <div key={i} style={{fontSize:11,color:t.tx2,padding:"3px 0",borderBottom:`1px solid ${t.brd}`,display:"flex",gap:8}}>
                      <span style={{color:t.acc,fontSize:9,marginTop:3}}>●</span>
                      <span style={{flex:1}}>{item.ing}</span>
                      <span style={{color:t.tx3,fontSize:9,flexShrink:0}}>{item.recipe}</span>
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <button onClick={generateShoppingList} disabled={!shoppingList.length}
            style={{flex:1,background:shoppingList.length?t.acc:t.sur2,color:shoppingList.length?"#FFF":t.tx3,border:"none",borderRadius:12,padding:"12px",cursor:shoppingList.length?"pointer":"default",fontSize:14,fontWeight:700}}>
            {shoppingList.length ? "📋 Copy / Share List" : "Select recipes above"}
          </button>
          <button onClick={()=>setShoppingList([])} style={{background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:12,padding:"12px 16px",cursor:"pointer",fontSize:13,color:t.tx2}}>Clear</button>
        </div>
      </div>
    </div>
  );

  const Tog = ({ on, set }) => (
    <button onClick={()=>set(!on)} style={{width:44,height:24,borderRadius:12,border:"none",cursor:"pointer",background:on?t.hAcc:t.sur2,position:"relative",transition:"background 0.2s",flexShrink:0}}>

    </button>
  );

    return (
      <div style={{display:"flex",gap:2}}>

        ))}
      </div>

  };

  const ShareModal = () => !shareText ? null : (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:600,display:"flex",alignItems:"flex-end"}} onClick={()=>setShareText(null)}>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:15,fontWeight:800,color:t.tx}}>⬆️ {shareText.title}</div>
          <button onClick={()=>setShareText(null)} style={{background:"none",border:"none",cursor:"pointer",color:t.tx3,fontSize:20,lineHeight:1}}>✕</button>
        </div>
        <p style={{fontSize:12,color:t.tx3,marginBottom:10}}>Copy the text below and paste it anywhere to share:</p>
        <textarea readOnly value={shareText.text}

              alert("Tap in the text above, select all, then copy.");

          </button>
          <button onClick={()=>setShareText(null)} style={{background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:12,padding:"13px 16px",cursor:"pointer",fontSize:13,color:t.tx2}}>Close</button>

  const RecipeCard = ({ r }) => {

    const bdrCol = (compareMode&&inCompare) ? t.acc : diabeticMode ? gi.color : t.brd;

    const made   = getMade(r.id);
    const rating = getRating(r.id);
    const allergens = getAllergens(r.id);
    const season = getSeasons(r.id)[0];
    const giDot  = r.gi_label==="low" ? "🟢" : r.gi_label==="medium" ? "🟡" : "🔴";
    return (
      <div onClick={()=>compareMode ? toggleCompare(r.id) : openR(r)}
        style={{background:t.sur,border:`${bdrW} solid ${bdrCol}`,borderRadius:18,overflow:"hidden",cursor:"pointer",transition:"transform 0.18s,box-shadow 0.18s",position:"relative"}}
        onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow=`0 10px 28px ${t.brd}`;}}
        onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none";}}>
        {compareMode&&inCompare&&<div style={{position:"absolute",inset:0,background:`${t.acc}18`,zIndex:1,pointerEvents:"none",borderRadius:16}}><div style={{position:"absolute",top:8,right:8,background:t.acc,color:"#FFF",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800}}>✓</div></div>}
        <div style={{background:`${ac}18`,borderBottom:`1px solid ${t.brd}`,padding:"16px 14px 12px",textAlign:"center",position:"relative"}}>
          {defs.showOff&&r.official&&<span style={{position:"absolute",top:8,right:8,background:t.acc,color:"#FFF",fontSize:9,fontWeight:800,padding:"3px 7px",borderRadius:8}}>OFFICIAL</span>}
          {defs.showAlc&&r.alc&&<span style={{position:"absolute",top:8,left:8,background:"#D32F2F",color:"#FFF",fontSize:9,fontWeight:800,padding:"3px 7px",borderRadius:8}}>18+</span>}
          {made>0&&<span style={{position:"absolute",bottom:8,left:8,background:t.hAcc,color:"#FFF",fontSize:9,fontWeight:800,padding:"3px 7px",borderRadius:8}}>✓ {made}×</span>}
          <button onClick={e=>{e.stopPropagation();toggleFav(r.id);}} style={{position:"absolute",bottom:8,right:8,background:"none",border:"none",fontSize:16,cursor:"pointer",lineHeight:1}}>{isFav?"❤️":"🤍"}</button>
          <div style={{fontSize:36,marginBottom:6}}>{r.emoji}</div>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,lineHeight:1.3}}>{r.name}</div>
        </div>
        <div style={{padding:"10px 12px"}}>

          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:5}}>

            <span style={{background:gi.bg,color:gi.color,fontSize:10,padding:"2px 7px",borderRadius:8,fontWeight:700}}>{giDot} GI {r.gi}</span>

            {defs.showHuel&&r.huel&&<span style={{background:dark?"#0D1A0D":"#E8F5E9",color:t.hAcc,fontSize:10,padding:"2px 7px",borderRadius:8,fontWeight:600}}>🌿 Huel+</span>}
          </div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {(r.diet||[]).slice(0,2).map(d=><span key={d} style={{background:t.sur2,color:DIET_LABELS[d]?.color||t.tx3,fontSize:9,padding:"2px 6px",borderRadius:6}}>{DIET_LABELS[d]?.emoji} {DIET_LABELS[d]?.label}</span>)}
            {allergens.map(a=><span key={a} style={{background:"rgba(230,81,0,0.12)",color:"#E65100",fontSize:9,padding:"2px 6px",borderRadius:6,fontWeight:700}}>⚠️ {ALLERGENS[a]?.label}</span>)}
            {(() => { const d=getDifficulty(r); return <span style={{background:t.sur2,color:d.color,fontSize:9,padding:"2px 6px",borderRadius:6}}>{d.emoji} {d.label}</span>; })()}

  const RecipeGrid = ({ recipes }) => (

      {recipes.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:"50px 20px",color:t.tx3}}><div style={{fontSize:44,marginBottom:10}}>🌀</div><div style={{fontSize:16,fontWeight:700,color:t.tx2,marginBottom:4}}>No recipes found</div><div style={{fontSize:12}}>Try adjusting your filters</div></div>}
    </div>
  );

  // ── HOME ───────────────────────────────────────────────────────────────────
  const HomeView = () => {
    const recentRecipes = recent.map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
    const favRecipes = RECIPES
      .filter(r => favs.includes(r.id) && !(defs.lowGIOnly && r.gi_label === "high"))
      .sort((a,b) => diabeticMode ? a.gi - b.gi : a.name.localeCompare(b.name));
    return (
      <div style={{padding:"0 14px 20px"}}>
        <div style={{padding:"16px 0 12px",textAlign:"center"}}>
          <div style={{fontSize:38,marginBottom:4}}>🌀</div>
          <div style={{fontSize:19,fontWeight:800,color:t.tx,letterSpacing:"-0.5px"}}>BlendBoss</div>
          <div style={{fontSize:11,color:t.tx3}}>Recipe Hub · {RECIPES.length} recipes</div>
        </div>
        <div style={{position:"relative",marginBottom:12}}>
          <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:t.tx3,fontSize:14}}>🔍</span>
          <input value={q} onChange={e=>{setQ(e.target.value);if(e.target.value)setSelCat("all");}} placeholder="Search all recipes..."
            style={{width:"100%",background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:12,padding:"9px 10px 9px 34px",color:t.tx,fontSize:14,outline:"none"}}/>
        </div>
        {/* Onboarding - first run only */}

              <div style={{fontSize:15,fontWeight:800,color:t.acc}}>👋 Welcome to BlendBoss!</div>
              <button onClick={()=>{setOnboarded(true);storage.set("bb_onboarded",true);}} style={{background:"none",border:"none",cursor:"pointer",color:t.tx3,fontSize:16,lineHeight:1}}>✕</button>
            </div>
            <p style={{fontSize:12,color:t.tx2,lineHeight:1.6,marginBottom:10}}>Your Ninja blender companion — {RECIPES.length} smoothie recipes with nutrition info, GI scores, Huel & New You boosts, and a full blend builder.</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              {[["🔎","Find","Filter by ingredient, diet & more"],["🧪","Build","Create your own custom blend"],["📅","Tracker","Log smoothies & track nutrition"]].map(([e,t2,d])=>(
                <div key={t2} style={{background:t.sur,borderRadius:10,padding:"8px 6px",textAlign:"center"}}>
                  <div style={{fontSize:18,marginBottom:2}}>{e}</div>
                  <div style={{fontSize:10,fontWeight:700,color:t.tx,marginBottom:1}}>{t2}</div>
                  <div style={{fontSize:9,color:t.tx3,lineHeight:1.3}}>{d}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {q ? (
          <><div style={{fontSize:12,color:t.tx3,marginBottom:12}}>{filtered.length} result{filtered.length!==1?"s":""} for "{q}"</div><RecipeGrid recipes={filtered}/></>
        ) : (
          <>
            {/* Diabetic mode banner */}
            {diabeticMode && (() => {
              const hidden = RECIPES.filter(r=>r.gi_label==="high").length;
              return (
                <div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:12,padding:"10px 14px",marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:18}}>🩺</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:700,color:"#2E7D32"}}>Diabetic Mode Active</div>
                      <div style={{fontSize:11,color:"#388E3C"}}>Recipes sorted lowest GI first · {hidden} high-GI recipes flagged</div>
                    </div>
                    <button onClick={()=>setDiabeticMode(false)} style={{background:"none",border:"none",cursor:"pointer",color:"#2E7D32",fontSize:12,fontWeight:600}}>Off</button>
                  </div>
                </div>
              );
            })()}
        {/* Surprise me */}
            <button onClick={randomRecipe} style={{width:"100%",background:`linear-gradient(135deg,${t.acc},#FF3D00)`,color:"#FFF",border:"none",borderRadius:14,padding:"13px",fontSize:15,fontWeight:800,cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:10,letterSpacing:"-0.2px"}}>
              🎲 Surprise Me — Random Recipe
            </button>
            {/* Compare toggle */}
            <button onClick={()=>setShowShopping(true)} style={{width:"100%",background:shoppingList.length>0?`${t.acc}18`:t.sur2,color:shoppingList.length>0?t.acc:t.tx2,border:`1px solid ${shoppingList.length>0?t.acc:t.brd}`,borderRadius:12,padding:"10px",fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              🛒 Shopping List{shoppingList.length>0?` (${shoppingList.length} recipe${shoppingList.length!==1?"s":""})`:""}
            </button>
            <button onClick={()=>setCompareMode(!compareMode)} style={{width:"100%",background:compareMode?t.acc:t.sur2,color:compareMode?"#FFF":t.tx2,border:`1px solid ${compareMode?t.acc:t.brd}`,borderRadius:12,padding:"10px",fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {compareMode ? `⚖️ Comparing ${compareIds.length}/3 — tap recipes to select` : "⚖️ Compare Recipes"}
            </button>
            {compareMode && compareIds.length >= 2 && (
              <button onClick={()=>{setTab("compare");}} style={{width:"100%",background:t.hAcc,color:"#FFF",border:"none",borderRadius:12,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:16}}>
                View Comparison →
              </button>

            {/* Recently viewed */}
            {recentRecipes.length > 0 && (
              <div style={{marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}}>Recently Viewed</div>
                <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:4,scrollbarWidth:"none"}}>
                  {recentRecipes.map(r=>(
                    <button key={r.id} onClick={()=>openR(r)} style={{flexShrink:0,background:t.sur,border:`1px solid ${t.brd}`,borderRadius:12,padding:"10px 14px",cursor:"pointer",textAlign:"center",minWidth:90}}>
                      <div style={{fontSize:24,marginBottom:4}}>{r.emoji}</div>
                      <div style={{fontSize:10,fontWeight:600,color:t.tx,lineHeight:1.2}}>{r.name.length > 14 ? r.name.slice(0,13)+"…" : r.name}</div>
                    </button>

                </div>
              </div>
            )}
            {/* Favourites */}
            {favRecipes.length > 0 && (
              <div style={{marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}}>❤️ Favourites</div>
                <RecipeGrid recipes={favRecipes}/>
              </div>
            )}
            {/* Category grid */}
            <div style={{fontSize:12,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}}>Browse by Category</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(125px,1fr))",gap:10}}>
              {CATS.filter(c=>c.id!=="all").map(c=>{
                const count=RECIPES.filter(r=>r.cat===c.id&&!(defs.lowGIOnly&&r.gi_label==="high")).length;
                return (
                  <button key={c.id} onClick={()=>setSelCat(c.id)}
                    style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:14,padding:"14px 10px",cursor:"pointer",textAlign:"center",transition:"transform 0.15s,box-shadow 0.15s",display:"flex",flexDirection:"column",alignItems:"center",gap:5}}
                    onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 20px ${t.brd}`;}}
                    onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none";}}>
                    <div style={{fontSize:32,marginBottom:2}}>{c.emoji}</div>
                    <div style={{fontSize:11,fontWeight:700,color:t.tx,lineHeight:1.3}}>{c.label}</div>
                    <div style={{fontSize:10,color:t.tx3}}>{count} recipes</div>
                    <div style={{width:"100%",height:3,background:t.sur2,borderRadius:2,marginTop:3}}>
                      <div style={{width:`${Math.min(100,(count/RECIPES.length)*100*(CATS.length-1))}%`,height:"100%",background:c.color,borderRadius:2}}/>
                    </div>
                  </button>
                );
              })}
            </div>
          </>
        )}
      </div>
    );
  };

  // ── CATEGORY VIEW ─────────────────────────────────────────────────────────
  const CatView = () => {
    const ci = CAT_MAP[selCat]||CATS[0];
    return (
      <div style={{padding:"0 14px 20px"}}>
        <button onClick={()=>{setSelCat(null);setQ("");}} style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:10,padding:"7px 14px",cursor:"pointer",marginBottom:14,fontSize:13,color:t.tx2,display:"flex",alignItems:"center",gap:6}}>← Home</button>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <div style={{fontSize:38}}>{ci.emoji}</div>
          <div><h1 style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:2}}>{ci.label}</h1><div style={{fontSize:12,color:t.tx3}}>{filtered.length} recipe{filtered.length!==1?"s":""}</div></div>
          <button onClick={randomRecipe} style={{marginLeft:"auto",background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,color:t.tx2}}>🎲 Random</button>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:150,position:"relative"}}>
            <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:t.tx3,fontSize:13}}>🔍</span>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search..."
              style={{width:"100%",background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:12,padding:"8px 10px 8px 30px",color:t.tx,fontSize:13,outline:"none"}}/>
          </div>
          <button onClick={()=>setOffOnly(!offOnly)} style={{background:offOnly?t.acc:t.sur2,color:offOnly?"#FFF":t.tx2,border:`1px solid ${t.brd}`,borderRadius:12,padding:"8px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>⭐ Official</button>
        </div>
        <RecipeGrid recipes={filtered}/>
      </div>
    );
  };

  // ── COMPARE VIEW ──────────────────────────────────────────────────────────
  const CompareView = () => {
    const recs = compareIds.map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
    if (recs.length < 2) return (
      <div style={{padding:"40px 20px",textAlign:"center",color:t.tx3}}>
        <div style={{fontSize:44,marginBottom:10}}>⚖️</div>
        <div style={{fontSize:16,fontWeight:700,color:t.tx2,marginBottom:6}}>Select 2 or 3 recipes to compare</div>
        <div style={{fontSize:12}}>Go to Recipes tab, enable Compare mode, and tap recipes</div>
        <button onClick={()=>setTab("recipes")} style={{marginTop:16,background:t.acc,color:"#FFF",border:"none",borderRadius:10,padding:"10px 20px",cursor:"pointer",fontSize:13,fontWeight:600}}>Go to Recipes</button>
      </div>
    );
    const fields = [
      {key:"cal",  label:"Calories", unit:"kcal", color:t.acc},
      {key:"pro",  label:"Protein",  unit:"g",    color:"#4CAF50"},
      {key:"carb", label:"Carbs",    unit:"g",    color:"#FF9800"},
      {key:"fat",  label:"Fat",      unit:"g",    color:"#9C27B0"},
      {key:"fib",  label:"Fibre",    unit:"g",    color:"#00BCD4"},
      {key:"sug",  label:"Sugar",    unit:"g",    color:"#E91E63"},
    ];
    return (
      <div style={{padding:"0 14px 20px"}}>
        <div style={{padding:"16px 0 12px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:19,fontWeight:800,color:t.tx}}>⚖️ Recipe Comparison</div>
          <button onClick={()=>{setCompareIds([]);setCompareMode(false);setTab("recipes");}} style={{marginLeft:"auto",background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:11,color:t.tx3}}>Clear</button>
        </div>
        {/* Headers */}
        <div style={{display:"grid",gridTemplateColumns:`120px ${"1fr ".repeat(recs.length)}`,gap:8,marginBottom:4}}>
          <div/>
          {recs.map(r=>(
            <div key={r.id} style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:14,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:26,marginBottom:4}}>{r.emoji}</div>
              <div style={{fontSize:11,fontWeight:700,color:t.tx,lineHeight:1.3}}>{r.name}</div>
              <div style={{fontSize:9,color:GI_INFO[r.gi_label].color,fontWeight:600,marginTop:3}}>GI {r.gi}</div>
              <button onClick={()=>setCompareIds(c=>c.filter(x=>x!==r.id))} style={{marginTop:6,background:"none",border:"none",color:t.tx3,cursor:"pointer",fontSize:10}}>✕ Remove</button>
            </div>
          ))}
        </div>
        {fields.map(f=>{
          const vals = recs.map(r=>r.nut[f.key]||0);
          const best = f.key==="cal"||f.key==="sug"||f.key==="carb"||f.key==="fat" ? Math.min(...vals) : Math.max(...vals);
          return (
            <div key={f.key} style={{display:"grid",gridTemplateColumns:`120px ${"1fr ".repeat(recs.length)}`,gap:8,marginBottom:6}}>
              <div style={{display:"flex",alignItems:"center",fontSize:12,fontWeight:600,color:t.tx2}}>{f.label}</div>
              {vals.map((v,i)=>(
                <div key={i} style={{background:v===best?`${f.color}22`:t.sur,border:`1px solid ${v===best?f.color:t.brd}`,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontSize:17,fontWeight:800,color:v===best?f.color:t.tx}}>{+(v.toFixed?v.toFixed(1):v)}</div>
                  <div style={{fontSize:9,color:t.tx3}}>{f.unit}</div>

  const DetailView = () => {

    const gi = GI_INFO[selR.gi_label];
    const catRecipes = RECIPES.filter(r => r.cat === selR.cat);

          <button onClick={()=>toggleFav(selR.id)} style={{background:isFav?`#E91E6322`:t.sur,border:`1px solid ${isFav?"#E91E63":t.brd}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:14}}>{isFav?"❤️":"🤍"}</button>
          <button onClick={()=>toggleCompare(selR.id)} style={{background:compareIds.includes(selR.id)?`${t.acc}22`:t.sur,border:`1px solid ${compareIds.includes(selR.id)?t.acc:t.brd}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,color:compareIds.includes(selR.id)?t.acc:t.tx2,fontWeight:600}}>⚖️</button>
          <button onClick={()=>incrementMade(selR.id)} style={{background:getMade(selR.id)>0?`${t.hAcc}22`:t.sur,border:`1px solid ${getMade(selR.id)>0?t.hAcc:t.brd}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,color:getMade(selR.id)>0?t.hAcc:t.tx2,fontWeight:600}}>

          </button>
          <div style={{display:"flex",alignItems:"center",gap:4,background:t.sur,border:`1px solid ${t.brd}`,borderRadius:10,padding:"4px 8px"}}>
            <span style={{fontSize:11,color:t.tx3}}>📅</span>
            {[1,2,3,4].map(n=>(
              <button key={n} onClick={()=>logToday(selR,n)} style={{background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:7,width:22,height:22,cursor:"pointer",fontSize:10,fontWeight:700,color:t.tx2,display:"flex",alignItems:"center",justifyContent:"center"}}>×{n}</button>
            ))}
          </div>
          <button onClick={()=>shareRecipe(selR)} style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,color:t.tx2,fontWeight:600}}>⬆️ Share</button>
          <button onClick={()=>{
            setShoppingList(s=>s.includes(selR.id)?s:s.length<20?[...s,selR.id]:s);
            setShowShopping(true);
          }} style={{background:shoppingList.includes(selR.id)?`${t.acc}22`:t.sur,border:`1px solid ${shoppingList.includes(selR.id)?t.acc:t.brd}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,color:shoppingList.includes(selR.id)?t.acc:t.tx2,fontWeight:600}}>
            🛒 {shoppingList.includes(selR.id)?"List":"Shop"}
          </button>
        </div>
        {/* Star rating */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <span style={{fontSize:12,color:t.tx3}}>Your rating:</span>
          <StarRating id={selR.id}/>
          {getRating(selR.id)>0&&<span style={{fontSize:11,color:"#F5C800",fontWeight:600}}>{getRating(selR.id)}/5</span>}
        </div>
        <div style={{background:`${ac}12`,border:`1px solid ${ac}28`,borderRadius:20,padding:"20px 18px",marginBottom:12,textAlign:"center",position:"relative"}}>
          {selR.official&&<div style={{position:"absolute",top:12,right:12,background:t.acc,color:"#FFF",fontSize:10,fontWeight:800,padding:"4px 10px",borderRadius:10}}>⭐ OFFICIAL</div>}
          {selR.alc&&<div style={{background:"#FF3D0022",border:"1px solid #FF3D0044",color:"#FF6B6B",borderRadius:10,padding:"5px 12px",marginBottom:10,display:"inline-block",fontSize:13,fontWeight:600}}>18+ Contains Alcohol</div>}
          <div style={{fontSize:48,marginBottom:8}}>{selR.emoji}</div>
          <h1 style={{fontSize:19,fontWeight:800,color:t.tx,marginBottom:8,letterSpacing:"-0.4px"}}>{selR.name}</h1>
          <p style={{color:t.tx2,fontSize:13,maxWidth:440,margin:"0 auto 12px",lineHeight:1.6}}>{selR.desc}</p>
          <div style={{display:"flex",gap:7,justifyContent:"center",flexWrap:"wrap"}}>

              <span key={x} style={{background:t.tag,color:t.tagTx,fontSize:11,padding:"4px 10px",borderRadius:8,fontWeight:600}}>{x}</span>
            ))}
            {(() => { const d=getDifficulty(selR); return <span style={{background:`${d.color}18`,color:d.color,fontSize:11,padding:"4px 10px",borderRadius:8,fontWeight:600}}>{d.emoji} {d.label}</span>; })()}
          </div>
        </div>

        {/* Serving scaler */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:14,padding:"12px 16px",marginBottom:12,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:13,color:t.tx,fontWeight:600}}>Servings:</span>
          {[1,2,3,4].map(m=>(
            <button key={m} onClick={()=>setServMult(m)} style={{background:servMult===m?t.acc:t.sur2,color:servMult===m?"#FFF":t.tx2,border:`1px solid ${servMult===m?t.acc:t.brd}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontWeight:700,fontSize:14}}>{m}</button>
          ))}
          {servMult>1&&<span style={{fontSize:12,color:t.tx3}}>× {servMult} = {Math.round(selR.nut.cal*servMult)} kcal total</span>}

                let impNote = "";
                if (imperial) {
                  const gMatch  = scaled.match(/^([\d.]+)\s*g\b/);
                  const mlMatch = scaled.match(/^([\d.]+)\s*ml\b/);
                  if (gMatch)  impNote = ` (≈ ${fmtWeight(parseFloat(gMatch[1]), true)})`;
                  if (mlMatch) impNote = ` (≈ ${fmtVol(parseFloat(mlMatch[1]), true)})`;
                }
                return (
                  <li key={i} style={{display:"flex",gap:7,padding:"4px 0",borderBottom:i<selR.ing.length-1?`1px solid ${t.brd}`:"none"}}>
                    <span style={{color:ac,fontSize:9,marginTop:5,flexShrink:0}}>●</span>
                    <span style={{fontSize:11,color:t.tx,lineHeight:1.4}}>

            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>

                <div key={key} style={{background:t.sur2,borderRadius:10,padding:"8px"}}>
                  <div style={{fontSize:9,color:t.tx3,marginBottom:2,textTransform:"uppercase",letterSpacing:"0.5px"}}>{label}</div>
                  <div style={{fontSize:15,fontWeight:800,color}}>{n[key]}<span style={{fontSize:9,color:t.tx3,marginLeft:1}}>{unit}</span></div>
                </div>
              ))}
            </div>
            <p style={{fontSize:9,color:t.tx3,marginTop:8}}>* Estimates — vary by brand.</p>
          </div>
        </div>

        {/* ── CHARTS ─────────────────────────────────────────────────────── */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:16,padding:"16px",marginBottom:12}}>

          {/* GI Gauge */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Glycaemic Index</div>

          {/* Macro donut */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Macro Breakdown</div>
            <MacroDonut pro={n.pro} carb={n.carb} fat={n.fat} fib={n.fib} t={t}/>
          </div>
          {/* Calorie breakdown */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Calorie Sources</div>
            <CalBreakdown pro={n.pro} carb={n.carb} fat={n.fat} cal={n.cal} t={t}/>
          </div>
          {/* Nutrient bars */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Nutrient Bars</div>
            <MiniBar label="Protein"  value={n.pro}  max={60}  color="#4CAF50" unit="g"    t={t}/>
            <MiniBar label="Fibre"    value={n.fib}  max={30}  color="#00BCD4" unit="g"    t={t}/>
            <MiniBar label="Carbs"    value={n.carb} max={100} color="#FF9800" unit="g"    t={t}/>
            <MiniBar label="Fat"      value={n.fat}  max={50}  color="#9C27B0" unit="g"    t={t}/>
          </div>
          {/* Sugar vs Fibre */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Sugar vs Fibre</div>
            <SugarFibreChart sug={n.sug} fib={n.fib} t={t}/>
          </div>
        </div>

        {/* Allergen warnings */}
        {getAllergens(selR.id).length > 0 && (
          <div style={{background:dark?"#1A0D00":"#FFF8F0",border:"1px solid #E6500044",borderRadius:12,padding:"10px 14px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:"#E65000",marginBottom:6}}>⚠️ Allergen Information</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {getAllergens(selR.id).map(a=>(
                <span key={a} style={{background:ALLERGENS[a].color+"22",color:ALLERGENS[a].color,fontSize:11,padding:"3px 8px",borderRadius:8,fontWeight:700}}>
                  {ALLERGENS[a].emoji} Contains {ALLERGENS[a].label}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* Personal notes */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:t.tx3,letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}}>📝 My Notes</div>
          {noteEdit === selR.id ? (
            <div>
              <textarea value={noteDraft} onChange={e=>setNoteDraft(e.target.value)} placeholder="Add your own notes, tweaks or tips..."
                style={{width:"100%",minHeight:80,background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:10,padding:"8px 10px",color:t.tx,fontSize:12,resize:"vertical",outline:"none",fontFamily:"inherit"}}/>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button onClick={()=>{setNotes(n=>({...n,[selR.id]:noteDraft}));setNoteEdit(null);}} style={{background:t.acc,color:"#FFF",border:"none",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>Save</button>
                <button onClick={()=>setNoteEdit(null)} style={{background:t.sur2,color:t.tx2,border:`1px solid ${t.brd}`,borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12}}>Cancel</button>
                {notes[selR.id]&&<button onClick={()=>{setNotes(n=>{const c={...n};delete c[selR.id];return c;});setNoteEdit(null);}} style={{background:"none",border:"none",color:"#D32F2F",cursor:"pointer",fontSize:12,marginLeft:"auto"}}>Delete</button>}
              </div>
            </div>
          ) : (
            <div>
              {notes[selR.id] ? (
                <p style={{fontSize:12,color:t.tx2,lineHeight:1.6,marginBottom:8}}>{notes[selR.id]}</p>
              ) : (
                <p style={{fontSize:12,color:t.tx3,marginBottom:8}}>No notes yet — add your own tweaks or tips.</p>
              )}
              <button onClick={()=>{setNoteDraft(notes[selR.id]||"");setNoteEdit(selR.id);}} style={{background:t.sur2,border:`1px solid ${t.brd}`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,color:t.tx2}}>
                {notes[selR.id]?"✏️ Edit note":"+ Add note"}
              </button>
            </div>
          )}
        </div>

        {/* Ingredient swap suggestions */}
        {(() => { const swaps = getSwaps(selR); return swaps.length > 0 ? (
          <div style={{background:dark?"#0A1020":"#EEF4FF",border:"1px solid #B3C7E6",borderRadius:14,padding:"14px",marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,color:dark?"#7EB3FF":"#1A4A8A",marginBottom:10}}>💡 Lower-GI Ingredient Swaps</div>
            <div style={{fontSize:11,color:dark?"#94B8D8":"#2A5A9A",marginBottom:10,lineHeight:1.5}}>
              Want to reduce the GI of this recipe? Try these swaps:
            </div>

              <div key={i} style={{background:dark?"#0D1A2E":"#FFFFFF",borderRadius:10,padding:"10px 12px",marginBottom:i<swaps.length-1?8:0}}>
                <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                  <span style={{fontSize:16,flexShrink:0}}>🔄</span>
                  <div>
                    <div style={{fontSize:12,color:dark?"#94B8D8":"#1A4A8A",marginBottom:2}}>
                      <strong style={{color:dark?"#FF9B9B":"#C62828"}}>Instead of:</strong> {s.ingredient}
                    </div>
                    <div style={{fontSize:12,color:dark?"#7EB3FF":"#1A4A8A",marginBottom:3}}>
                      <strong style={{color:dark?"#81C784":"#2E7D32"}}>Try:</strong> {s.alt}
                    </div>
                    <div style={{fontSize:11,color:dark?"#64B5F6":"#2A5A9A",lineHeight:1.4,marginBottom:4}}>{s.reason}</div>
                    <span style={{background:dark?"#0D2A1A":"#E8F5E9",color:dark?"#81C784":"#2E7D32",fontSize:10,padding:"2px 8px",borderRadius:20,fontWeight:600}}>💚 {s.saving}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

        <div style={{background:t.sur,border:`1px solid ${ac}28`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {["💧 Liquid first, solids second, frozen last","🧊 Less liquid = thicker result",
              ...(hOn&&selR.huel&&selR.huel.ml>0?[`🌿 Add ${imperial?fmtVol(selR.huel.ml,true):selR.huel.ml+"ml"} extra liquid for Huel`]:[])
            ].map(tip=><div key={tip} style={{background:t.sur2,borderRadius:10,padding:"6px 10px",fontSize:11,color:t.tx2}}>{tip}</div>)}
          </div>

              <Tog on={hOn} set={setHOn}/>

            {hOn&&(
              <div>
                <div style={{fontSize:10,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Best Match</div>

                  {[selR.huel.best,...selR.huel.alts].map((fid,i)=>{ const f=HUEL[fid]; if(!f)return null;
                    return <div key={fid} style={{background:i===0?`${t.hAcc}18`:t.sur2,border:`1px solid ${i===0?t.hAcc:t.brd}`,borderRadius:12,padding:"8px 12px",display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:17}}>{f.emoji}</span>
                      <div><div style={{fontSize:11,fontWeight:700,color:i===0?t.hAcc:t.tx2}}>{f.name}</div><div style={{fontSize:9,color:t.tx3}}>{i===0?"⭐ Best match":"Alt"}</div></div>
                    </div>;

                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>

                  <span style={{fontSize:11,color:t.tx3}}>{sc*38}g · {sc*148}kcal · {sc*15}g protein</span>
                </div>
                <div style={{background:dark?"#091509":t.sur2,borderRadius:10,padding:"10px",fontSize:12,color:t.hTx,lineHeight:1.5,fontStyle:"italic"}}>💡 {selR.huel.note}</div>
              </div>
            )}
          </div>

        <div style={{background:dark?"#0D0D1A":"#F0F0FF",border:`1px solid ${dark?"#2A2A4A":"#C0C0E0"}`,borderRadius:16,padding:"16px",marginBottom:12}}>

              <div style={{fontSize:14,fontWeight:800,color:dark?"#A0A0FF":"#3333CC",marginBottom:2}}>✨ Add New You Boost</div>

            <Tog on={nyuOn} set={setNyuOn}/>
          </div>
          {nyuOn&&(
            <div>
              <div style={{fontSize:10,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Flavour</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>

            {/* Full nutrition charts */}
            {builderNut.cal > 0 && (

                <div style={{fontSize:12,fontWeight:700,color:t.tx,marginBottom:12}}>📊 Nutritional Charts</div>
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:10,fontWeight:700,color:t.tx3,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:7}}>Macro Breakdown</div>

  // ── TRACKER VIEW ──────────────────────────────────────────────────────────
  const TrackerView = () => {
    const today = todayStr();

    const last7 = Array.from({length:7}, (_,i) => {
      const d = new Date(); d.setDate(d.getDate()-i);
      return d.toISOString().slice(0,10);
    }).reverse();
    const dayLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const weekData = last7.map(date => {
      const entries = trackerLog.filter(e=>e.date===date);
      const cal = Math.round(entries.reduce((s,e)=>s+(e.nut.cal*e.servings),0));
      const giVals = entries.map(e=>{ const r=RECIPES.find(x=>x.id===e.id); return r?r.gi:null; }).filter(Boolean);
      const avgGI = giVals.length ? Math.round(giVals.reduce((s,v)=>s+v,0)/giVals.length) : null;
      const d = new Date(date+"T12:00:00");
      return { date, label:dayLabels[d.getDay()===0?6:d.getDay()-1], cal, avgGI, entries:entries.length };
    });
    const maxCal = Math.max(...weekData.map(d=>d.cal), trackerTargets.cal, 1);
    const pct = key => Math.min(100, trackerTargets[key]>0 ? (todayTotals[key]/trackerTargets[key])*100 : 0);
    return (
      <div style={{padding:"0 14px 20px"}}>
        <div style={{padding:"16px 0 12px",display:"flex",alignItems:"center",gap:10}}>
          <div>
            <div style={{fontSize:19,fontWeight:800,color:t.tx,marginBottom:2}}>📅 Daily Tracker</div>

          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
            <div style={{background:diabeticMode?"#E8F5E9":t.sur2,border:`1px solid ${diabeticMode?"#A5D6A7":t.brd}`,borderRadius:10,padding:"5px 10px",display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} onClick={()=>setDiabeticMode(!diabeticMode)}>
              <span style={{fontSize:14}}>🩺</span>
              <span style={{fontSize:11,fontWeight:600,color:diabeticMode?"#2E7D32":t.tx2}}>GI Mode</span>
              <Tog on={diabeticMode} set={setDiabeticMode}/>
            </div>
          </div>
        </div>

        {/* Today's totals */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:16,padding:"16px",marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:12}}>Today's Nutrition</div>
          {[
            {key:"cal", label:"Calories", unit:"kcal", color:t.acc},
            {key:"pro", label:"Protein",  unit:"g",    color:"#4CAF50"},
            {key:"carb",label:"Carbs",    unit:"g",    color:"#FF9800"},
            {key:"fat", label:"Fat",      unit:"g",    color:"#9C27B0"},
            {key:"fib", label:"Fibre",    unit:"g",    color:"#00BCD4"},
          ].map(({key,label,unit,color})=>(
            <div key={key} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:12,color:t.tx2,fontWeight:600}}>{label}</span>
                <span style={{fontSize:12,color,fontWeight:700}}>{+(todayTotals[key]||0).toFixed(1)}{unit} <span style={{color:t.tx3,fontWeight:400}}>/ {trackerTargets[key]}{unit}</span></span>
              </div>
              <div style={{height:8,background:t.sur2,borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct(key)}%`,background:pct(key)>100?"#D32F2F":color,borderRadius:4,transition:"width 0.5s"}}/>
              </div>
            </div>
          ))}
        </div>

        {/* 7-day summary */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:16,padding:"16px",marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:14}}>📈 7-Day Summary</div>
          <div style={{display:"flex",gap:4,alignItems:"flex-end",height:80,marginBottom:8}}>
            {weekData.map((d,i)=>{
              const h = d.cal>0 ? Math.max(6, (d.cal/maxCal)*72) : 4;
              const giCol = d.avgGI==null?"#888":d.avgGI<55?"#2E7D32":d.avgGI<70?"#E65100":"#C62828";
              const isToday = d.date===today;
              return (
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  {d.avgGI!=null&&<div style={{fontSize:8,color:giCol,fontWeight:700}}>GI{d.avgGI}</div>}
                  <div style={{width:"100%",height:h,background:isToday?t.acc:"#4CAF50",borderRadius:"3px 3px 0 0",opacity:d.cal>0?1:0.15,transition:"height 0.4s"}}/>
                  {d.cal>0&&<div style={{fontSize:8,color:t.tx3}}>{d.cal>999?Math.round(d.cal/100)/10+"k":d.cal}</div>}
                  <div style={{fontSize:9,fontWeight:isToday?800:400,color:isToday?t.acc:t.tx3}}>{d.label}</div>
                </div>
              );
            })}
          </div>
          {weekData.every(d=>d.cal===0) ? (
            <div style={{textAlign:"center",padding:"8px",fontSize:11,color:t.tx3}}>No smoothies logged this week yet — log a recipe to see your chart fill up</div>

            <div style={{fontSize:10,color:t.tx3,textAlign:"center"}}>Calories per day · GI labels = average GI of logged smoothies</div>

        {/* Daily targets */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:16,padding:"16px",marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:12}}>🎯 Daily Targets</div>
          {[
            {key:"cal", label:"Calories", unit:"kcal"},
            {key:"pro", label:"Protein",  unit:"g"},
            {key:"carb",label:"Carbs",    unit:"g"},
            {key:"fat", label:"Fat",      unit:"g"},
            {key:"fib", label:"Fibre",    unit:"g"},

            <div key={key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${t.brd}`}}>

              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <button onClick={()=>setTrackerTargets(tr=>({...tr,[key]:Math.max(0,tr[key]-(key==='cal'?50:key==='fib'?1:5))}))} style={{width:24,height:24,borderRadius:6,border:`1px solid ${t.brd}`,background:t.sur2,cursor:"pointer",color:t.tx,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <span style={{fontSize:13,fontWeight:700,color:t.tx,minWidth:40,textAlign:"center"}}>{trackerTargets[key]}</span>
                <button onClick={()=>setTrackerTargets(tr=>({...tr,[key]:tr[key]+(key==='cal'?50:key==='fib'?1:5)}))} style={{width:24,height:24,borderRadius:6,border:`1px solid ${t.brd}`,background:t.sur2,cursor:"pointer",color:t.tx,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              </div>
            </div>
          ))}
        </div>

        {/* Today's log */}
        <div style={{background:t.sur,border:`1px solid ${t.brd}`,borderRadius:16,padding:"16px",marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

              <div style={{fontSize:40,marginBottom:10}}>🌀</div>

            todayLog.map((entry,i)=>(
              <div key={i} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 0",borderBottom:i<todayLog.length-1?`1px solid ${t.brd}`:"none"}}>

                  <div style={{fontSize:12,fontWeight:600,color:t.tx}}>{entry.name}</div>
                  <div style={{fontSize:10,color:t.tx3}}>{Math.round(entry.nut.cal*entry.servings)} kcal · {+(entry.nut.pro*entry.servings).toFixed(1)}g protein</div>
                </div>
                <button onClick={()=>setTrackerLog(l=>{const nl=[...l];nl.splice(i,1);return nl;})} style={{background:"none",border:"none",cursor:"pointer",color:t.tx3,fontSize:14}}>✕</button>
              </div>
            ))
          )}
        </div>
      </div>
    );
  };
